[mypy]
python_version = 3.11
warn_unused_ignores = True

# requests has a real, well-known stub package (types-requests), but not every
# environment running this check has it installed (e.g. an isolated tool venv
# with no pip) -- ignoring missing imports for this one third-party module is
# simpler and more portable than making the stub package a hard dependency for
# a codebase that only uses requests.get() in one file (arxiv_ingest.py).
[mypy-requests]
ignore_missing_imports = True
